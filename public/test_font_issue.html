<!DOCTYPE html>
<html>
<body>
<script type="module">
  import opentype from 'https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js';
  
  async function run() {
    try {
      const cps = [65]; // 'A'
      
      const notdef = new opentype.Glyph({ name: '.notdef', unicode: undefined, advanceWidth: 1000, path: new opentype.Path() });
      
      const newPath = new opentype.Path();
      newPath.moveTo(0, 0);
      newPath.lineTo(100, 0);
      newPath.lineTo(100, 100);
      newPath.close();
      
      const glyphs = [notdef];
      for (const cp of cps) {
        glyphs.push(new opentype.Glyph({
          name: cp === 0 ? '.null' : ('uni' + cp.toString(16).toUpperCase()),
          unicode: cp,
          advanceWidth: 800,
          path: newPath
        }));
      }
      
      const font = new opentype.Font({
        familyName: "TracedFont",
        styleName: 'Regular',
        unitsPerEm: 1000,
        ascender: 800,
        descender: -200,
        glyphs: glyphs,
      });
      
      const buffer = font.toArrayBuffer();
      
      const fontFace = new FontFace(`Test`, buffer);
      await fontFace.load();
      document.body.innerHTML = 'SUCCESS';
    } catch(e) {
      document.body.innerHTML = 'ERROR: ' + e.message;
    }
  }
  run();
</script>
</body>
</html>
